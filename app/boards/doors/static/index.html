<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<title>Tasklane</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v=4">
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="i-plate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.6 2.5L16 9.5"/></symbol>
  <symbol id="i-late" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4.5l3 1.5M9 2.5h6"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M15.5 5.2a3.5 3.5 0 010 6.6M18 14.8c1.9.8 3 2.4 3.5 5.2"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
  <symbol id="i-summary" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<header class="top">
  <a class="brand" href="/" aria-label="Tasklane home">
    <img src="/static/logo.svg" alt="" width="28" height="28"><span>Tasklane</span>
  </a>
  <nav class="pickers" aria-label="Workspace and board">
    <label class="sr" for="ws-pick">Workspace</label>
    <select id="ws-pick" hidden></select>
    <label class="sr" for="board-pick">Board</label>
    <select id="board-pick" hidden></select>
  </nav>
  <form id="search" class="search" role="search">
    <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
    <label class="sr" for="q">Search cards</label>
    <input id="q" type="search" placeholder="Search cards, #12, a label" autocomplete="off" enterkeyhint="search">
  </form>
  <nav class="views" aria-label="Views">
    <button type="button" data-panel="plate"><svg class="icon" aria-hidden="true"><use href="#i-plate"/></svg><span>My plate</span></button>
    <button type="button" data-panel="overdue"><svg class="icon" aria-hidden="true"><use href="#i-late"/></svg><span>Overdue</span><b id="late-count" class="dot" hidden></b></button>
    <button type="button" data-panel="activity" class="m-only"><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg><span>Activity</span></button>
    <button type="button" data-panel="people"><svg class="icon" aria-hidden="true"><use href="#i-people"/></svg><span>People</span></button>
  </nav>
  <div class="account">
    <span id="who" class="who"></span>
    <a class="link" href="/.dodil/auth/logout">Sign out</a>
  </div>
</header>

<main id="main">
  <section id="empty" class="empty"><p class="note">Loading your boards…</p></section>
  <section id="board" class="board" hidden>
    <div class="board-head">
      <h1 id="board-title"></h1>
      <span id="board-role" class="badge"></span>
      <div class="spacer"></div>
      <button type="button" class="quiet" data-panel="summary" title="Daily summary"><svg class="icon" aria-hidden="true"><use href="#i-summary"/></svg><span>Daily summary</span></button>
      <button type="button" class="quiet d-only" data-panel="activity"><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg><span>Activity</span></button>
      <button type="button" id="new-board" class="quiet" title="New board"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Board</span></button>
    </div>
    <nav id="lane-tabs" class="lane-tabs" aria-label="Lists"></nav>
    <div id="lanes" class="lanes"></div>
  </section>
</main>

<div id="scrim" class="scrim" hidden></div>
<aside id="panel" class="panel" hidden aria-live="polite" aria-labelledby="panel-title">
  <div class="panel-head"><h2 id="panel-title"></h2>
    <button type="button" class="icon-btn" id="panel-close" aria-label="Close panel"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <div id="panel-body" class="panel-body"></div>
</aside>

<dialog id="card-dialog" class="card-dialog" aria-label="Card">
  <form method="dialog" id="card-form"></form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
<script src="/static/app.js?v=4"></script>
</body>
</html>
